<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coda lavori · Bunny Video Report</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  </head>
  <body>
    <main>
      <nav><a href="/">← Torna al catalogo</a></nav>
      <h1>Coda lavori</h1>
      <p>Il gruppo contiene {{ jobs|length }} lavori.</p>
      <ul>
        {% for job in jobs %}
        <li>
          <a href="/jobs/{{ job.id }}">{{ job.source_title or 'Report video' }}</a>
          · {{ job.message }}
        </li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
