<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bunny Video Report</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  </head>
  <body>
    <main>
      <h1>Bunny Video Report</h1>
      <p>Analisi interna dei video Bunny Stream.</p>
      <form action="/preview" method="post" class="panel">
        <input type="hidden" name="csrf_token" value="{{ request.app.state.csrf_token }}">
        <label for="source-url">Link del video Bunny</label>
        <input id="source-url" name="source_url" type="url" required autocomplete="off"
               placeholder="https://iframe.mediadelivery.net/embed/…" aria-describedby="privacy-note">
        <button type="submit">Anteprima e costo</button>
        <p id="privacy-note">Il video non viene conservato</p>
        <p class="muted">Durata massima: quattro ore. I file temporanei vengono eliminati dopo l’elaborazione.
          Il report rimane disponibile solo finché questo processo del server è attivo.</p>
      </form>
    </main>
  </body>
</html>
