<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accesso · Bunny Video Report</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  </head>
  <body>
    <main>
      <h1>Bunny Video Report</h1>
      <form action="/login" method="post" class="panel">
        <input type="hidden" name="csrf_token" value="{{ request.app.state.csrf_token }}">
        <label for="username">Utente</label>
        <input id="username" name="username" type="text" required autocomplete="username">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        <button type="submit">Accedi</button>
      </form>
    </main>
  </body>
</html>
